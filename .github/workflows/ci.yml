name: CI-rust

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    #TODO: run and test on wasm, win and linux
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./crate"

      - name: Check iOS
        run: |
          cd ./crate/ 
          cargo c --target=aarch64-apple-ios
          cargo b --target=aarch64-apple-ios
          cargo clippy --target=aarch64-apple-ios

      - name: Check MacOs
        run: |
          cd ./crate/ 
          cargo c
          cargo b
          cargo clippy
          cargo t

  build_egui:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./bevy_ios_gamecenter_egui"

      - name: Check iOS
        run: |
          cd bevy_ios_gamecenter_egui
          cargo c --target=aarch64-apple-ios
          cargo b --target=aarch64-apple-ios
          cargo clippy --target=aarch64-apple-ios

      - name: Check MacOs
        run: |
          cd bevy_ios_gamecenter_egui
          cargo c
          cargo b
          cargo clippy
          cargo t
